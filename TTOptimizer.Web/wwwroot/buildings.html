<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ClassFlow - Buildings</title>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body class="teachers-page">
<div class="page-container">
    <header class="app-header teachers-header">
        <div class="teachers-header-content">
            <div class="teachers-title-group">
                <span class="teachers-page-label">Organization resources</span>
                <h1>Buildings</h1>
                <p class="page-subtitle">Manage school buildings used by rooms and timetable constraints.</p>
            </div>
            <nav class="header-actions">
                <button class="secondary-button teachers-header-button" id="backToMainButton" type="button">Back</button>
                <button class="secondary-button teachers-header-button" id="refreshBuildingsButton" type="button">Refresh</button>
            </nav>
        </div>
    </header>

    <main class="content-card teachers-card">
        <div class="section-header teachers-section-header">
            <div>
                <h2>Buildings list</h2>
                <p class="teachers-section-description">Rooms can optionally be assigned to a building.</p>
            </div>
            <button class="primary-button teachers-add-button" id="addBuildingButton" type="button">
                <span aria-hidden="true">+</span> Add building
            </button>
        </div>

        <section class="resource-form-section teachers-form-section" hidden id="buildingFormSection">
            <h3 id="buildingFormTitle">Add building</h3>
            <input id="buildingId" type="hidden"/>
            <div class="form-grid teachers-form-grid">
                <div class="form-field">
                    <label for="buildingName">Name</label>
                    <input id="buildingName" maxlength="150" required type="text" placeholder="e.g. Main building"/>
                </div>
                <div class="form-field">
                    <label for="buildingAddress">Address</label>
                    <input id="buildingAddress" maxlength="500" type="text" placeholder="Optional address"/>
                </div>
                <div class="form-field form-field-full-width">
                    <label for="buildingInfo">Info</label>
                    <textarea id="buildingInfo" maxlength="2000" rows="4" placeholder="Optional information about the building"></textarea>
                </div>
            </div>
            <div class="form-actions teachers-form-actions">
                <button class="primary-button" id="saveBuildingButton" type="button">Save</button>
                <button class="secondary-button" id="cancelBuildingButton" type="button">Cancel</button>
            </div>
            <p aria-live="polite" class="form-message" id="buildingFormMessage"></p>
        </section>

        <div class="teachers-table-summary"><span id="buildingsCount">Loading buildings...</span></div>
        <div class="table-wrapper teachers-table-wrapper">
            <table class="data-table teachers-table" id="buildingsTable">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Address</th>
                    <th>Rooms</th>
                    <th>Info</th>
                    <th class="table-actions-column">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr><td class="teachers-table-state" colspan="5">Loading buildings...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script src="js/appContext.js"></script>
<script src="js/buildings.js"></script>
</body>
</html>
