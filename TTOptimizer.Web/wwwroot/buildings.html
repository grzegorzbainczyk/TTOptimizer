<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title data-i18n="buildings.pageTitle">ClassFlow - Buildings</title>
    <link href="css/style.css" rel="stylesheet"/>
</head>
<body class="teachers-page">
<div class="page-container">
    <header class="app-header teachers-header">
        <div class="teachers-header-content">
            <div class="teachers-title-group">
                <span class="teachers-page-label" data-i18n="common.organizationResources">Organization resources</span>
                <h1 data-i18n="buildings.title">Buildings</h1>
                <p class="page-subtitle"><span data-i18n="buildings.subtitle">Manage school buildings used by rooms and timetable constraints.</span></p>
            </div>
            <nav class="header-actions">
                <button class="secondary-button teachers-header-button" id="backToMainButton" type="button">← Sale i budynki</button>
                <button class="secondary-button teachers-header-button" id="refreshBuildingsButton" type="button" data-i18n="common.refresh">Refresh</button>
            </nav>
        </div>
    </header>

    <main class="content-card teachers-card">
        <div class="section-header teachers-section-header">
            <div>
                <h2 data-i18n="buildings.listTitle">Buildings list</h2>
                <p class="teachers-section-description"><span data-i18n="buildings.listDescription">Rooms can optionally be assigned to a building.</span></p>
            </div>
            <button class="primary-button teachers-add-button" id="addBuildingButton" type="button">
                <span aria-hidden="true">+</span> <span data-i18n="buildings.add">Add building</span>
            </button>
        </div>

        <section class="resource-form-section teachers-form-section" hidden id="buildingFormSection">
            <h3 id="buildingFormTitle" data-i18n="buildings.add">Add building</h3>
            <input id="buildingId" type="hidden"/>
            <div class="form-grid teachers-form-grid">
                <div class="form-field">
                    <label for="buildingName" data-i18n="common.name">Name</label>
                    <input id="buildingName" maxlength="150" required type="text" placeholder="e.g. Main building" data-i18n-placeholder="buildings.namePlaceholder"/>
                </div>
                <div class="form-field">
                    <label for="buildingAddress" data-i18n="buildings.address">Address</label>
                    <input id="buildingAddress" maxlength="500" type="text" placeholder="Optional address" data-i18n-placeholder="buildings.addressPlaceholder"/>
                </div>
                <div class="form-field form-field-full-width">
                    <label for="buildingInfo" data-i18n="common.info">Info</label>
                    <textarea id="buildingInfo" maxlength="2000" rows="4" placeholder="Optional information about the building" data-i18n-placeholder="buildings.infoPlaceholder"></textarea>
                </div>
            </div>
            <div class="form-actions teachers-form-actions">
                <button class="primary-button" id="saveBuildingButton" type="button" data-i18n="common.save">Save</button>
                <button class="secondary-button" id="cancelBuildingButton" type="button" data-i18n="common.cancel">Cancel</button>
            </div>
            <p aria-live="polite" class="form-message" id="buildingFormMessage"></p>
        </section>

        <div class="teachers-table-summary"><span id="buildingsCount">Loading buildings...</span></div>
        <div class="table-wrapper teachers-table-wrapper">
            <table class="data-table teachers-table" id="buildingsTable">
                <thead>
                <tr>
                    <th data-i18n="common.name">Name</th>
                    <th data-i18n="buildings.address">Address</th>
                    <th data-i18n="buildings.rooms">Rooms</th>
                    <th data-i18n="common.info">Info</th>
                    <th class="table-actions-column" data-i18n="common.actions">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr><td class="teachers-table-state" colspan="5">Loading buildings...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script src="js/appContext.js"></script>
<script type="module" src="js/buildings.js"></script>
</body>
</html>
