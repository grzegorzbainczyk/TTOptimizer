<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="availability.pageTitle">ClassFlow - Time Slot Preferences</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="availability-page">
    <main class="app-shell">
        <div class="app-container">
            <header class="app-header">
                <div>
                    <div class="hero-badge" data-i18n="availability.badge">Resource configuration</div>
                    <h1 id="availabilityPageTitle" data-i18n="availability.title">Time slot preferences</h1>
                    <p id="availabilityResourceName" class="hero-subtitle" data-i18n="availability.loadingResource">Loading resource...</p>
                </div>

                <nav class="header-actions" aria-label="Time slot preferences page actions">
                    <button id="backButton"
                            class="app-button app-button-secondary"
                            type="button" data-i18n="common.back">
                        Back
                    </button>

                    <button id="refreshAvailabilityButton"
                            class="app-button app-button-secondary"
                            type="button" data-i18n="common.refresh">
                        Refresh
                    </button>
                </nav>
            </header>

            <section class="app-card app-panel availability-card">
                <div class="availability-intro">
                    <h2 data-i18n="availability.weeklyTitle">Weekly time slot preferences</h2>
                    <p data-i18n="availability.instructions">Click a cell to cycle through: Preferred, Available, Not preferred and Unavailable.</p>
                </div>

                <div class="availability-toolbar">
                    <button id="markAllAvailableButton"
                            class="app-button app-button-secondary"
                            type="button" data-i18n="availability.markAllAvailable">
                        Mark all available
                    </button>

                    <button id="markAllUnavailableButton"
                            class="app-button app-button-secondary"
                            type="button" data-i18n="availability.markAllUnavailable">
                        Mark all unavailable
                    </button>
                </div>

                <div class="availability-legend" aria-label="Time slot preference legend">
                    <span class="availability-legend-item preferred" data-i18n="availability.preferred">Preferred</span>
                    <span class="availability-legend-item available" data-i18n="availability.available">Available</span>
                    <span class="availability-legend-item not-preferred" data-i18n="availability.notPreferred">Not preferred</span>
                    <span class="availability-legend-item unavailable" data-i18n="availability.unavailable">Unavailable</span>
                </div>

                <div class="availability-table-wrapper">
                    <table id="availabilityTable"
                           class="data-table availability-table">
                        <thead>
                            <tr>
                                <th data-i18n="availability.lesson">Lesson</th>
                                <th data-i18n="availability.monday">Monday</th>
                                <th data-i18n="availability.tuesday">Tuesday</th>
                                <th data-i18n="availability.wednesday">Wednesday</th>
                                <th data-i18n="availability.thursday">Thursday</th>
                                <th data-i18n="availability.friday">Friday</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="availability-save-actions">
                    <button id="saveAvailabilityButton"
                            class="app-button app-button-primary"
                            type="button" data-i18n="availability.save">
                        Save preferences
                    </button>
                </div>

                <p id="availabilityMessage"
                   class="availability-message"
                   aria-live="polite"></p>
            </section>
        </div>
    </main>

    <script src="js/appContext.js"></script>
    <script src="js/availability.js" type="module"></script>
</body>
</html>
