<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ClassFlow</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet" href="css/auth-validation.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-panel">

            <header class="auth-header">
                <h1>ClassFlow</h1>

                <p>
                    Organizuj i optymalizuj plany lekcji
                    z wykorzystaniem C++ i ASP.NET.
                </p>
            </header>

            <div class="auth-form">

                <div id="loginFields">
                    <div class="form-group">
                        <label for="loginEmailInput">E-mail</label>
                        <input id="loginEmailInput"
                               name="loginEmail"
                               type="email"
                               placeholder="user@example.com"
                               autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="loginPasswordInput">Hasło</label>
                        <input id="loginPasswordInput"
                               name="loginPassword"
                               type="password"
                               placeholder="Hasło"
                               autocomplete="current-password">
                    </div>
                </div>

                <div id="registrationFields" hidden>
                    <div class="form-group">
                        <label for="registerEmailInput">E-mail</label>
                        <input id="registerEmailInput"
                               name="registerEmail"
                               type="email"
                               placeholder="user@example.com"
                               autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="displayNameInput">Imię i nazwisko / nazwa użytkownika</label>
                        <input id="displayNameInput"
                               type="text"
                               maxlength="200"
                               autocomplete="name"
                               placeholder="np. Jan Kowalski">
                    </div>

                    <div class="form-group">
                        <label for="organizationNameInput">Nazwa organizacji</label>
                        <input id="organizationNameInput"
                               type="text"
                               maxlength="200"
                               placeholder="np. Zespół Szkół nr 1">
                    </div>

                    <div class="form-group">
                        <label for="registerPasswordInput">Hasło</label>
                        <input id="registerPasswordInput"
                               name="registerPassword"
                               type="password"
                               placeholder="Hasło"
                               autocomplete="new-password">
                    </div>

                    <div class="form-group">
                        <label for="confirmPasswordInput">Powtórz hasło</label>
                        <input id="confirmPasswordInput"
                               name="confirmPassword"
                               type="password"
                               placeholder="Powtórz hasło"
                               autocomplete="new-password">
                    </div>

                    <p class="demo-info">
                        Rejestracja utworzy nowe konto oraz nową organizację.
                    </p>
                </div>

                <div class="auth-actions">
                    <button id="loginButton"
                            type="button"
                            class="auth-button auth-button-primary">
                        Zaloguj
                    </button>

                    <button id="registerButton"
                            type="button"
                            class="auth-button auth-button-secondary">
                        Zarejestruj
                    </button>

                    <button id="cancelRegistrationButton"
                            type="button"
                            class="auth-button auth-button-secondary"
                            hidden>
                        Anuluj rejestrację
                    </button>
                </div>

                <div class="auth-separator">
                    <span>lub użyj trybu demonstracyjnego</span>
                </div>

                <div class="demo-buttons">

                    <button id="demoEmptyButton"
                            type="button"
                            class="demo-button">
                        <span class="demo-button-title">
                            Pusta szkoła
                        </span>
                        <span class="demo-button-description">
                            Wprowadź własne dane
                        </span>
                    </button>

                    <button id="demoSmallButton"
                            type="button"
                            class="demo-button">
                        <span class="demo-button-title">
                            Mała szkoła
                        </span>
                        <span class="demo-button-description">
                            Prosty zestaw danych
                        </span>
                    </button>

                    <button id="demoPrimarySchoolButton"
                            type="button"
                            class="demo-button">
                        <span class="demo-button-title">
                            Szkoła podstawowa
                        </span>
                        <span class="demo-button-description">
                            Realistyczne 16 oddziałów
                        </span>
                    </button>

                </div>

                <p class="demo-info">
                    Dane demonstracyjne są dostępne bez rejestracji.
                </p>

                <p id="authMessage"
                   class="auth-message"
                   aria-live="polite">
                </p>

            </div>

        </section>

    </main>

    <script src="js/appContext.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
