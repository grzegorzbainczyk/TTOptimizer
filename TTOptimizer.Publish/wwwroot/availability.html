<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassFlow - Resource Availability</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="availability-page">
    <main class="app-shell">
        <div class="app-container">
            <header class="app-header">
                <div>
                    <div class="hero-badge">Resource configuration</div>
                    <h1 id="availabilityPageTitle">Resource availability</h1>
                    <p id="availabilityResourceName" class="hero-subtitle">
                        Loading resource...
                    </p>
                </div>

                <nav class="header-actions" aria-label="Availability page actions">
                    <button id="backButton"
                            class="app-button app-button-secondary"
                            type="button">
                        Back
                    </button>

                    <button id="refreshAvailabilityButton"
                            class="app-button app-button-secondary"
                            type="button">
                        Refresh
                    </button>
                </nav>
            </header>

            <section class="app-card app-panel availability-card">
                <div class="availability-intro">
                    <h2>Weekly availability</h2>
                    <p>
                        Click a cell to switch between available and unavailable.
                    </p>
                </div>

                <div class="availability-toolbar">
                    <button id="markAllAvailableButton"
                            class="app-button app-button-secondary"
                            type="button">
                        Mark all available
                    </button>

                    <button id="markAllUnavailableButton"
                            class="app-button app-button-secondary"
                            type="button">
                        Mark all unavailable
                    </button>
                </div>

                <div class="availability-table-wrapper">
                    <table id="availabilityTable"
                           class="data-table availability-table">
                        <thead>
                            <tr>
                                <th>Lesson</th>
                                <th>Monday</th>
                                <th>Tuesday</th>
                                <th>Wednesday</th>
                                <th>Thursday</th>
                                <th>Friday</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="availability-save-actions">
                    <button id="saveAvailabilityButton"
                            class="app-button app-button-primary"
                            type="button">
                        Save availability
                    </button>
                </div>

                <p id="availabilityMessage"
                   class="availability-message"
                   aria-live="polite"></p>
            </section>
        </div>
    </main>

    <script src="js/appContext.js"></script>
    <script src="js/availability.js"></script>
</body>
</html>
