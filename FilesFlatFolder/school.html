<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassFlow - School information</title>
    <link href="css/style.css" rel="stylesheet" />
</head>
<body class="teachers-page school-page">
    <div class="page-container">
        <header class="app-header teachers-header">
            <div class="teachers-header-content">
                <div class="teachers-title-group">
                    <span class="teachers-page-label">Organization</span>
                    <h1>School information</h1>
                    <p class="page-subtitle">
                        General information about the current school.
                    </p>
                </div>

                <nav class="header-actions">
                    <button id="backToMainButton"
                            class="secondary-button teachers-header-button"
                            type="button">
                        Back
                    </button>
                </nav>
            </div>
        </header>

        <main class="content-card teachers-card school-card">
            <div class="section-header teachers-section-header">
                <div>
                    <h2>General information</h2>
                    <p class="teachers-section-description">
                        These details describe the school and can be changed later.
                    </p>
                </div>
            </div>

            <section class="resource-form-section school-form-section">
                <div class="school-form-grid">
                    <div class="form-field form-field-full-width">
                        <label for="schoolName">School name</label>
                        <input id="schoolName"
                               type="text"
                               maxlength="200"
                               required />
                        <p class="school-help-text">
                            This name is also shown on the ClassFlow dashboard.
                        </p>
                    </div>

                    <div class="form-field form-field-full-width">
                        <label for="schoolAddress">Address</label>
                        <textarea id="schoolAddress"
                                  rows="3"
                                  maxlength="500"
                                  placeholder="Optional school address"></textarea>
                    </div>

                    <div class="form-field form-field-full-width">
                        <label for="directorName">Director</label>
                        <input id="directorName"
                               type="text"
                               maxlength="200"
                               placeholder="Optional director name" />
                    </div>
                </div>

                <div class="school-form-actions">
                    <button id="saveSchoolButton"
                            class="main-action-button"
                            type="button">
                        Save changes
                    </button>

                    <button id="reloadSchoolButton"
                            class="secondary-button"
                            type="button">
                        Reload
                    </button>
                </div>

                <p id="schoolFormMessage"
                   class="form-message"
                   aria-live="polite"></p>
            </section>
        </main>
    </div>

    <script src="js/appContext.js"></script>
    <script src="js/school.js"></script>
</body>
</html>
