<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ClassFlow - Classes</title>
<link href="css/style.css" rel="stylesheet"/>
</head>
<body class="teachers-page">
<div class="page-container">
<header class="app-header teachers-header">


<div class="teachers-header-content"><div class="teachers-title-group">
<span class="teachers-page-label">Organization resources</span><h1>Classes</h1>
<p class="page-subtitle">
                    Classes assigned to your organization
                </p>
</div><nav class="header-actions">
<button class="secondary-button teachers-header-button" id="backToMainButton" type="button">
                    Back
                </button>
<button class="secondary-button teachers-header-button" id="refreshClassesButton" type="button">
                    Refresh
                </button>
</nav></div></header>
<main class="content-card teachers-card">
<div class="section-header teachers-section-header"><div><h2>Classes list</h2><p class="teachers-section-description">Manage class groups, homeroom teachers and default rooms.</p></div>

<button class="main-action-button teachers-add-button" id="addClassButton" type="button"><span aria-hidden="true">+</span>
                    Add class
                </button>
</div>
<section class="resource-form-section teachers-form-section" hidden="" id="classFormSection">
<h3 id="classFormTitle">Add class</h3>
<input id="classId" type="hidden"/>
<div class="form-grid teachers-form-grid">
<div class="form-field">
<label for="className">Name</label>
<input id="className" maxlength="50" required="" type="text"/>
</div>
<div class="form-field">
<label for="homeroomTeacherId">
                            Homeroom teacher
                        </label>
<select id="homeroomTeacherId">
<option value="">None</option>
</select>
</div>
<div class="form-field">
<label for="defaultRoomId">
                            Default room
                        </label>
<select id="defaultRoomId">
<option value="">None</option>
</select>
</div>
<div class="form-field form-field-full-width">
<label for="classInfo">Info</label>
<textarea id="classInfo" maxlength="2000" placeholder="Optional notes about the class" rows="4"></textarea>
</div>
</div>
<div class="form-actions teachers-form-actions">
<button class="main-action-button" id="saveClassButton" type="button">
                        Save
                    </button>
<button class="secondary-button" id="cancelClassButton" type="button">
                        Cancel
                    </button>
</div>
<p aria-live="polite" class="form-message" id="classFormMessage">
</p>
</section>
<div class="teachers-table-summary"><span id="classesCount">Loading classes...</span></div><div class="table-wrapper teachers-table-wrapper">
<table class="data-table teachers-table" id="classesTable">
<thead>
<tr>
<th>Name</th>
<th>Homeroom teacher</th>
<th>Default room</th>
<th>Info</th>
<th class="table-actions-column">
                                Actions
                            </th>
</tr>
</thead>
<tbody>
<tr>
<td class="teachers-table-state" colspan="5">
                                Loading classes...
                            </td>
</tr>
</tbody>
</table>
</div>
</main>
</div>
<script src="js/appContext.js"></script>
<script src="js/classes.js"></script>
</body>
</html>
